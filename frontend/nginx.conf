# ════════════════════════════════════════════════════════════════════════════
# NGINX CONFIGURATION FOR ANGULAR SPA
# ════════════════════════════════════════════════════════════════════════════
# This config handles:
# 1. Serving static files (JS, CSS, images)
# 2. SPA routing (all routes go to index.html)
# 3. Gzip compression for faster loading
# 4. Caching headers for performance
# ════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # GZIP COMPRESSION
    # Reduces file sizes by ~70% for text-based files
    # ─────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/json application/xml;

    # ─────────────────────────────────────────────────────────────────────────
    # STATIC FILES WITH CACHE
    # JS/CSS files have hash in filename, so we can cache forever
    # ─────────────────────────────────────────────────────────────────────────
    location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|gif|jpe?g|png|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # SPA ROUTING
    # All routes that don't match a file go to index.html
    # Angular Router handles the routing client-side
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # SECURITY HEADERS
    # Basic security headers for production
    # ─────────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
